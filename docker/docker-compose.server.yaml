# Agent Base production deployment for server 192.168.2.97.
# Host paths come from ../.env; runtime paths below are container paths.

services:
  nginx:
    image: ${NGINX_IMAGE:-m.daocloud.io/docker.io/library/nginx:alpine}
    container_name: agent-base-nginx
    ports:
      - "192.168.2.97:${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - agent-base
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NODE_IMAGE: ${NODE_IMAGE:-m.daocloud.io/docker.io/library/node:22-alpine}
    container_name: agent-base-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - AGENT_BASE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - AGENT_BASE_TRUSTED_ORIGINS=${AGENT_BASE_TRUSTED_ORIGINS:-${DEER_FLOW_TRUSTED_ORIGINS:-http://localhost:2026,http://localhost:3000}}
    env_file:
      - ../frontend/.env
    networks:
      - agent-base
    restart: unless-stopped

  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.12-slim-bookworm}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-m.daocloud.io/docker.io/library/docker:cli}
        UV_IMAGE: ${UV_IMAGE:-m.daocloud.io/ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: agent-base-gateway
    command: sh -c "cd /app/backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-4}"
    volumes:
      - ${AGENT_BASE_CONFIG_PATH:-${DEER_FLOW_CONFIG_PATH}}:/app/backend/config.yaml:ro
      - ${AGENT_BASE_EXTENSIONS_CONFIG_PATH:-${DEER_FLOW_EXTENSIONS_CONFIG_PATH}}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${AGENT_BASE_HOME}:/app/backend/.agent-base
      # Host source resolves from .env; application uses the container target below.
      - ${AGENT_BASE_KNOWLEDGE_ROOT:-${AGENT_BASE_HOME}/public-knowledge}:/app/backend/.agent-base/public-knowledge
      - ${AGENT_BASE_DOCKER_SOCKET:-${DEER_FLOW_DOCKER_SOCKET}}:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - AGENT_BASE_PROJECT_ROOT=/app
      - AGENT_BASE_HOME=/app/backend/.agent-base
      - AGENT_BASE_CONFIG_PATH=/app/backend/config.yaml
      - AGENT_BASE_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - AGENT_BASE_SKILLS_PATH=/app/skills
      # This must be the container path, never /srv/agent-base/public-knowledge.
      - AGENT_BASE_KNOWLEDGE_ROOT=/app/backend/.agent-base/public-knowledge
      - AGENT_BASE_CHANNELS_LANGGRAPH_URL=${AGENT_BASE_CHANNELS_LANGGRAPH_URL:-${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}}
      - AGENT_BASE_CHANNELS_GATEWAY_URL=${AGENT_BASE_CHANNELS_GATEWAY_URL:-${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}}
      - AGENT_BASE_INTERNAL_AUTH_TOKEN=${AGENT_BASE_INTERNAL_AUTH_TOKEN}
      - GATEWAY_ENABLE_LOCAL_AUTH=${GATEWAY_ENABLE_LOCAL_AUTH:-true}
      - AGENT_BASE_STRICT_USER_CONTEXT=${AGENT_BASE_STRICT_USER_CONTEXT:-true}
      - AGENT_BASE_HOST_BASE_DIR=${AGENT_BASE_HOME}
      - AGENT_BASE_HOST_SKILLS_PATH=${AGENT_BASE_REPO_ROOT:-${DEER_FLOW_REPO_ROOT}}/skills
      - AGENT_BASE_SANDBOX_HOST=host.docker.internal
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-base
    restart: unless-stopped

  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.12-slim-bookworm}
    container_name: agent-base-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=agent-base
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${AGENT_BASE_REPO_ROOT:-${DEER_FLOW_REPO_ROOT}}/skills
      - THREADS_HOST_PATH=${AGENT_BASE_HOME}/threads
      - USERS_HOST_PATH=${AGENT_BASE_HOME}/users
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  agent-base:
    driver: bridge
